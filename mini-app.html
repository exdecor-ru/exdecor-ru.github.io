<html lang="ru">
<head>
  <meta charset="utf-8">

  <title>EX-DECOR — Каталог материалов</title>
  <style>
:root {
  color-scheme: light;
  font: 16px system-ui, sans-serif;
  background: #f8f5ee;
  color: #242820;
  --line: #d9d4c8;
  --ink: #26392a;
  --paper: #fffdf7;
}
* { box-sizing: border-box; }
body { margin: 0; }
header, main { max-width: 960px; margin: auto; }
header { display: flex; justify-content: space-between; padding: 20px 20px 15px; border-bottom: 1px solid var(--line); }
header strong { letter-spacing: .1em; }
header strong span { color: #87623b; }
header > span, #intro { color: #5c6256; }
main { padding: 24px 20px 100px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1; letter-spacing: -.055em; }
#intro { margin: 10px 0 20px; }
#filters { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; margin-bottom: 22px; }
label { display: grid; gap: 6px; font-size: .85rem; font-weight: 650; }
[hidden] { display: none !important; }
button, input, select, a { font: inherit; }
button, input, select { border: 1px solid var(--line); border-radius: 9px; color: inherit; background: var(--paper); }
input, select { min-width: 0; width: 100%; padding: 11px 9px; }
button { cursor: pointer; min-height: 44px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
article { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
.open { display: grid; width: 100%; padding: 0; text-align: left; border: 0; border-radius: 0; }
.texture { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #ebe5d7; }
.summary { display: grid; gap: 5px; padding: 12px; }
.sku { letter-spacing: .08em; font-size: .76rem; font-weight: 750; color: #545f4f; }
.status { color: #655c50; font-size: .78rem; }
.favorite { position: absolute; top: 8px; right: 8px; min-width: 44px; font-size: 1.25rem; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--line); }
nav button { flex: 0 1 175px; padding: 0 8px; }
[aria-current], [aria-pressed="true"] { color: white; background-color: var(--ink); }
dialog { width: min(calc(100% - 24px), 540px); max-height: 94dvh; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); color: inherit; }
dialog::backdrop { background: #192219aa; }
.detail-bar, .gallery { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.detail-bar button, .gallery button { padding: 0 12px; }
#large-image { border-radius: 10px; margin-bottom: 10px; }
#large-image.sample { object-fit: contain; }
h2 { margin-top: 5px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; }
dd { margin: 0; }
.contact { display: block; padding: 13px; background: var(--ink); color: white; border-radius: 9px; text-align: center; text-decoration: none; }
.source { display: block; margin-top: 12px; text-align: center; color: var(--ink); }
.empty { grid-column: 1 / -1; color: #5c6256; }
#more { display: block; margin: 20px auto 0; padding: 0 20px; }
:focus-visible { outline: 3px solid #a26333; outline-offset: -3px; }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

</style>
  
  
</head>

const find = (id) => document.getElementById(id);
const pageSize = 16;
const storageKey = "ex-decor-favorites";
let favorites = new Set();
try {
  const stored = JSON.parse(localStorage.getItem(storageKey) || "[]");
  if (Array.isArray(stored)) favorites = new Set(stored);
} catch {
  // The catalog still works in browsers with storage disabled.
}

let view = "catalog";
let current = null;
let limit = pageSize;

function toggleFavorite(sku) {
  if (favorites.has(sku)) favorites.delete(sku);
  else favorites.add(sku);
  try { localStorage.setItem(storageKey, JSON.stringify([...favorites])); } catch {}
  render();
  updateSaveButton();
}

function render() {
  const query = find("query").value.trim().toLocaleLowerCase("ru");
  const material = find("material").value;
  const tone = find("tone").value;
  const budget = find("budget").value;
  const visible = items.filter((item) => {
    if (view === "saved") return favorites.has(item.sku);
    const text = [item.sku, item.name, item.material, item.tone, item.collection].join(" ").toLocaleLowerCase("ru");
    if (view === "match" && budget && (item.price == null || item.price > Number(budget))) return false;
    return text.includes(query) && (!material || material === item.material) && (!tone || tone === item.tone);
  });
  find("products").replaceChildren(...visible.slice(0, limit).map(productCard));
  find("more").hidden = visible.length <= limit;
  find("more").textContent = `Показать ещё · ${Math.min(limit, visible.length)} из ${visible.length}`;
  if (!visible.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = view === "saved" ? "Сохрани образец сердечком, чтобы он появился здесь."
      : view === "match" && budget ? "У образцов пока нет цен. Убери бюджет, чтобы посмотреть фактуры."
      : "По этим параметрам образцов нет.";
    find("products").append(empty);
  }
}

function productCard(item) {
  const card = document.createElement("article");
  card.innerHTML = `<button type="button" class="open"><img class="texture" alt="" loading="lazy"><span class="summary"><span class="sku">${item.sku}</span><strong>${item.name}</strong><span class="status">${item.collection} · наличие уточняется</span></span></button><button type="button" class="favorite" aria-label="Избранное: ${item.sku}" aria-pressed="${favorites.has(item.sku)}">${favorites.has(item.sku) ? "♥" : "♡"}</button>`;
  setSampleImage(card.querySelector("img"), item);
  card.querySelector(".open").addEventListener("click", () => showDetails(item));
  card.querySelector(".favorite").addEventListener("click", () => toggleFavorite(item.sku));
  return card;
}

function setSampleImage(image, item) {
  image.onerror = () => {
    image.onerror = null;
    image.src = `https://exdecor-ru.github.io/${item.image}`;
  };
  image.src = `/${item.image}`;
}

function updateSaveButton() {
  if (!current) return;
  const saved = favorites.has(current.sku);
  find("save").textContent = saved ? "Сохранено" : "В избранное";
  find("save").setAttribute("aria-pressed", saved);
}

function showDetails(item) {
  current = item;
  find("detail-sku").textContent = item.sku;
  find("detail-title").textContent = item.name;
  find("specs").innerHTML = `<dt>Материал</dt><dd>${item.material}</dd><dt>Коллекция</dt><dd>${item.collection}</dd><dt>Оттенок</dt><dd>${item.tone}</dd><dt>Размер</dt><dd>${item.size}</dd><dt>Цена и наличие</dt><dd>Уточняются</dd>`;
  find("source").href = `https://exdecor-ru.github.io/#${item.section}`;
  const message = `Здравствуйте! Подскажите цену и наличие декора ${item.sku}.`;
  find("contact").href = `https://t.me/panelka56?text=${encodeURIComponent(message)}`;
  showPhoto("sample");
  updateSaveButton();
  find("details").showModal();
}

function showPhoto(photo) {
  const image = find("large-image");
  if (photo === "sample") setSampleImage(image, current);
  else {
    image.onerror = null;
    image.src = `/img/v2/${current.interior}.jpg`;
  }
  image.alt = photo === "sample" ? current.name : `Пример применения материала: ${current.material}`;
  image.classList.toggle("sample", photo === "sample");
  document.querySelectorAll("[data-photo]").forEach((button) => {
    button.setAttribute("aria-pressed", button.dataset.photo === photo);
  });
}

const titles = { catalog: "Каталог материалов", match: "Подбор материалов", saved: "Избранное" };
const intros = {
  catalog: "50 бамбуковых панелей и 50 декоров гибкого мрамора",
  match: "Выбери материал, оттенок и бюджет.",
  saved: "Образцы, которые ты сохранил на этом устройстве.",
};

document.querySelectorAll("[data-view]").forEach((button) => {
  button.addEventListener("click", () => {
    view = button.dataset.view;
    limit = pageSize;
    document.querySelectorAll("[data-view]").forEach((item) => item.removeAttribute("aria-current"));
    button.setAttribute("aria-current", "page");
    find("heading").textContent = titles[view];
    find("intro").textContent = intros[view];
    find("filters").hidden = view === "saved";
    find("budget-field").hidden = view !== "match";
    render();
  });
});
document.querySelectorAll("[data-photo]").forEach((button) => button.addEventListener("click", () => showPhoto(button.dataset.photo)));
["query", "material", "tone", "budget"].forEach((id) => find(id).addEventListener("input", () => {
  limit = pageSize;
  render();
}));
find("more").addEventListener("click", () => {
  limit += pageSize;
  render();
});
find("close").addEventListener("click", () => find("details").close());
find("save").addEventListener("click", () => { if (current) toggleFavorite(current.sku); });
render();

</script>
